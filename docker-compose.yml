services:
  syno-ia:
    # Étiquette pilotée par SYNO_IA_TAG dans .env, afin qu'une mise à jour ne
    # puisse pas basculer par erreur sur l'autre variante :
    #   latest-llm → avec llama.cpp compilé sans AVX (LLM 100 % local)
    #   latest     → image allégée, sans LLM local (mode extractif ou distant)
    # La variante « -llm » est un sur-ensemble : elle convient dans tous les cas.
    image: ghcr.io/flake9025/syno-ia:${SYNO_IA_TAG:-latest-llm}
    # Pour construire localement à la place :
    # build:
    #   context: .
    #   args:
    #     WITH_LOCAL_LLM: "false"
    container_name: syno-ia
    restart: unless-stopped
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
      # Depuis un conteneur du NAS, la passerelle du bridge Docker atteint DSM.
      DSM_URL: "http://172.17.0.1:5000"
      INDEX_MODE: mount
      # Dossiers personnels : chaque utilisateur n'y retrouve que les siens.
      # Pour ajouter des dossiers partagés (« ls -1 /volume1/ », casse comprise),
      # complétez cette liste et montez chacun d'eux ci-dessous.
      INDEX_ROOTS: "/volume1/homes"
    volumes:
      # Index SQLite + modèles téléchargés (doit survivre aux mises à jour).
      - /volume1/docker/apps/syno-ia/data:/app/data
      # Partages à indexer, montés **en lecture seule** et **au même chemin**
      # que sur le NAS : l'identité des chemins permet de rejouer les ACL DSM.
      # Un montage par partage, et chacun doit figurer dans INDEX_ROOTS.
      - /volume1/homes:/volume1/homes:ro
      # - /volume1/documents:/volume1/documents:ro
      # - /volume1/projets:/volume1/projets:ro
    # Pas de `healthcheck` ici : celui de l'image fait foi (voir Dockerfile).
    # Le redéfinir à deux endroits a déjà conduit à une sonde plus stricte que
    # prévu, donc à des redémarrages en pleine réponse.
    # Le DS218+ n'a que 2 cœurs : on laisse de l'air à DSM.
    cpus: 1.5
    mem_limit: 5g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
