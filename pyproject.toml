[project]
name = "syno-ia"
version = "1.0.0"
description = "RAG privé auto-hébergé pour NAS Synology, avec authentification et permissions DSM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# La racine du dépôt doit être importable : la CI lance « pytest » directement,
# et contrairement à « python -m pytest » cela n'ajoute pas le dossier courant
# au sys.path.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "network: test nécessitant un téléchargement de modèle (désactivé en CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # la longueur est gérée par le formateur
    "B008",   # Depends() en valeur par défaut : idiome FastAPI
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
