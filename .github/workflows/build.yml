name: Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: syno-ia
  PYTHON_VERSION: '3.11'

jobs:
  lint_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests (pytest)
        run: pytest -q

      - name: Export version
        id: version
        run: echo "value=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.version.outputs.value }}

  docker_smoke:
    runs-on: ubuntu-latest
    needs: lint_test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: |
            WITH_LOCAL_LLM=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name syno-ia-ci -p 8080:8080 \
            -e APP_SECRET=ci-secret \
            -e EMBEDDING_BACKEND=none \
            -e LLM_BACKEND=none \
            -e INDEX_ON_STARTUP=false \
            -e INDEX_INTERVAL_MINUTES=0 \
            -e DSM_URL=http://127.0.0.1:5000 \
            ${{ env.IMAGE_NAME }}:ci

      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              curl -fsS http://localhost:8080/api/info; echo
              # L'interface web doit être servie par le même conteneur.
              curl -fsS -o /dev/null http://localhost:8080/
              # Aucune route protégée ne doit répondre sans session DSM.
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/documents)
              test "$code" = "401" || { echo "ATTENDU 401, RECU $code"; exit 1; }
              exit 0
            fi
            sleep 3
          done
          docker logs syno-ia-ci --tail 200
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f syno-ia-ci || true

  docker_image:
    runs-on: ubuntu-latest
    needs: [lint_test, docker_smoke]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            WITH_LOCAL_LLM=false
            APP_VERSION=${{ needs.lint_test.outputs.version }}
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Variante avec llama.cpp compilé SANS AVX/AVX2 : seule option fonctionnelle
  # sur les NAS x86 à processeur Celeron Apollo Lake (DS218+, DS718+, DS918+…).
  # La compilation est longue, donc réservée à la branche par défaut et aux tags.
  docker_image_llm:
    runs-on: ubuntu-latest
    needs: [lint_test, docker_smoke]
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-llm,onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push Docker image (LLM local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            WITH_LOCAL_LLM=true
            APP_VERSION=${{ needs.lint_test.outputs.version }}
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_nas:
    runs-on: ubuntu-latest
    needs: [docker_image, docker_image_llm]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    permissions:
      contents: read

    steps:
      - name: Notify NAS
        env:
          NAS_WEBHOOK_URL: ${{ secrets.NAS_WEBHOOK_URL }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
        run: |
          if [ -z "$NAS_WEBHOOK_URL" ]; then
            echo "Secret NAS_WEBHOOK_URL absent — déploiement automatique ignoré."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$NAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"$IMAGE\"}"
